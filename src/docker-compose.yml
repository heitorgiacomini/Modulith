services:
  postgres:
    image: postgres:18

  seq:
    image: datalust/seq:latest

  redis:
    image: redis:latest

  rabbitmq:
    image: rabbitmq:management

  keycloak:
    image: ${DOCKER_REGISTRY-}keycloak-organizations
    pull_policy: never
    build:
      context: .
      dockerfile: docker-config/keycloak/Dockerfile

  keycloak-configurator:
    image: node:24-alpine

  keycloak-verifier:
    image: node:24-alpine

  api:
    image: ${DOCKER_REGISTRY-}api
    pull_policy: never
    build:
      context: .
      dockerfile: Bootstrapper/Api/Dockerfile
    ports:
      - "5004:8080"

  fusion-composer:
    image: mcr.microsoft.com/dotnet/sdk:10.0

  graphql-gateway:
    image: ${DOCKER_REGISTRY-}graphql-gateway
    pull_policy: never
    build:
      context: .
      dockerfile: Bootstrapper/Gateway/Dockerfile
    ports:
      - "5002:8080"

  web-client:
    image: ${DOCKER_REGISTRY-}web-client
    pull_policy: never
    build:
      context: ./web-client
      dockerfile: Dockerfile

volumes:
  postgres_eshopdb:
  angular_node_modules:
  fusion_gateway:






