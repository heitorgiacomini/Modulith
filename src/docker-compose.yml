services:
  postgres:
    image: postgres:18

  redis:
    image: redis:latest

  rabbitmq:
    image: rabbitmq:management

  keycloak:
    image: ${DOCKER_REGISTRY-}keycloak-organizations
    pull_policy: never
    build:
      context: .
      dockerfile: docker-config/keycloak/Dockerfile

  keycloak-configurator:
    image: node:24-alpine

  opensearch:
    image: opensearchproject/opensearch:2.19.6

  opensearch-configurator:
    image: curlimages/curl:8.16.0

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6

  opensearch-dashboards-configurator:
    image: curlimages/curl:8.16.0

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0

  otel-collector-configurator:
    image: curlimages/curl:8.16.0

  api:
    image: ${DOCKER_REGISTRY-}api
    pull_policy: never
    build:
      context: .
      dockerfile: Bootstrapper/Api/Dockerfile
    ports:
      - "5004:8080"

  graphql-gateway:
    image: ${DOCKER_REGISTRY-}graphql-gateway
    pull_policy: never
    build:
      context: .
      dockerfile: Bootstrapper/Gateway/Dockerfile
    ports:
      - "5002:8080"

  graphql-gateway-configurator:
    image: mcr.microsoft.com/dotnet/sdk:10.0

  web-client:
    image: ${DOCKER_REGISTRY-}web-client
    pull_policy: never
    build:
      context: ./web-client
      dockerfile: Dockerfile

volumes:
  postgres_eshopdb:
  angular_node_modules:
  fusion_gateway:
  opensearch_data:
  otel_collector_state:
  audit_logs:






