<div class="page-shell">
  <app-data-page-card title="Your orders"
    subtitle="Orders appear asynchronously after Basket checkout is published through the outbox."
    [count]="totalRecords()" countLabel="orders" [loading]="loading()" [error]="errorMessage()" (refresh)="refresh()">
    <p-table #ordersTable [value]="orders()" dataKey="id" [lazy]="true" [paginator]="true" [rows]="pageSize"
      [first]="tableFirst()" [totalRecords]="totalRecords()" [rowsPerPageOptions]="[5, 10, 20]" [loading]="loading()"
      [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
      [tableStyle]="{ 'min-width': '64rem' }" (onLazyLoad)="onLazyLoad($event)">
      <ng-template pTemplate="caption">
        <app-table-caption title="Orders" subtitle="Refresh after checkout while messaging completes"
          (clear)="clearFilters(ordersTable)" />
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th class="expander-column"></th>
          <th>Order</th>
          <th>Items</th>
          <th>Total</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-order let-expanded="expanded">
        <tr>
          <td><button pButton type="button" [pRowToggler]="order" [text]="true" [rounded]="true"
              [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></button></td>
          <td><strong>{{ order.orderName }}</strong>
            <div class="row-id">{{ order.id }}</div>
          </td>
          <td>{{ order.itemCount }}</td>
          <td><strong>{{ order.totalPrice | currency }}</strong></td>
        </tr>
      </ng-template>
      <ng-template pTemplate="expandedrow" let-order>
        <tr>
          <td colspan="4" class="expanded-cell">
            <div class="items-panel">
              <h3>Order items</h3><p-table [value]="order.items">
                <ng-template pTemplate="header">
        <tr>
          <th>Product ID</th>
          <th>Quantity</th>
          <th>Unit price</th>
          <th>Total</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.productId }}</td>
          <td>{{ item.quantity }}</td>
          <td>{{ item.price | currency }}</td>
          <td>{{ lineTotal(item) | currency }}</td>
        </tr>
      </ng-template>
    </p-table>
</div>
</td>
</tr></ng-template>
<ng-template pTemplate="emptymessage">
  <tr>
    <td colspan="4">No orders yet.</td>
  </tr>
</ng-template>
</p-table>
</app-data-page-card>
</div>
