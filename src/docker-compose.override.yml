services:
  postgres:
    environment:
      - POSTGRES_USER=eshopdb
      - POSTGRES_PASSWORD=eshopdb
      - POSTGRES_DB=eshopdb
    ports:
      - "5434:5432"
    restart: always
    volumes:
      - postgres_eshopdb:/var/lib/postgresql
      - ./docker-config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshopdb -d eshopdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # make postgres create schema before using keycloak
  keycloak:
    environment:
      - KEYCLOAK_ADMIN=eshopdb
      - KEYCLOAK_ADMIN_PASSWORD=eshopdb
      - KC_DB=postgres
      #- KC_DB_URL=jdbc:postgresql://postgres:5432/eshopdb?currentSchema=keycloak
      - KC_DB_SCHEMA=keycloak
      - KC_DB_USERNAME=eshopdb
      - KC_DB_PASSWORD=eshopdb
      - KC_HTTP_PORT=9090
      #- KC_HOSTNAME=127.0.0.1
      #- KC_HOSTNAME=http://identity:9090/
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY=edge
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=eshopdb
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker-config/keycloak:/opt/keycloak/data/import:ro
    command:
      - start-dev
      - --import-realm
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-configurator:
    environment:
      - KEYCLOAK_URL=http://keycloak:9090
      - KEYCLOAK_ADMIN=eshopdb
      - KEYCLOAK_ADMIN_PASSWORD=eshopdb
      - API_URL=http://api:8080
    volumes:
      - ./docker-config/keycloak/configure-organizations.mjs:/configure-organizations.mjs:ro
      - ./docker-config/keycloak/verify-multitenancy.mjs:/verify-multitenancy.mjs:ro
    command: ["node", "/configure-organizations.mjs"]
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  redis:
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=eshopdb
      - RABBITMQ_DEFAULT_PASS=eshopdb
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"


  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=postgres;Port=5432;Database=eshopdb;User Id=eshopdb;Password=eshopdb;Include Error Detail=true
      - ConnectionStrings__Redis=redis:6379
      - MessageBroker__Host=amqp://rabbitmq:5672
      - MessageBroker__UserName=eshopdb
      - MessageBroker__Password=eshopdb
      - Keycloak__AuthServerUrl=http://keycloak:9090/
      - Keycloak__PublicIssuer=http://localhost:9090/realms/eshoprealm
      - OTEL_SERVICE_NAME=eshop-api
      - OTEL_DEPLOYMENT_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - AuditTrail__DirectoryPath=/var/log/eshop/audit
      - AuditTrail__FileNamePrefix=eshop-audit
      - AuditTrail__MaxFileSizeBytes=134217728
      - AuditTrail__RetainedFileCount=8
    depends_on:
      otel-collector:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak-configurator:
        condition: service_completed_successfully
    ports:
      - "5004:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - audit_logs:/var/log/eshop/audit
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/graphql/catalog/schema.graphqls"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  graphql-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Fusion__SchemaPath=/app/fusion/gateway.far
      - ReverseProxy__Clusters__api__Destinations__primary__Address=http://api:8080/
      - Keycloak__AuthServerUrl=http://keycloak:9090/
      - Keycloak__PublicIssuer=http://localhost:9090/realms/eshoprealm
      - OTEL_SERVICE_NAME=eshop-gateway
      - OTEL_DEPLOYMENT_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - fusion_gateway:/app/fusion:ro
    depends_on:
      graphql-gateway-configurator:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      api:
        condition: service_healthy

  graphql-gateway-configurator:
    working_dir: /workspace
    environment:
      - API_URL=http://api:8080
      - SCHEMA_ROOT=/tmp/fusion
      - ARCHIVE_DIRECTORY=/fusion-output
    volumes:
      - ./:/workspace:ro
      - fusion_gateway:/fusion-output
    command: bash /workspace/docker-config/fusion/compose-gateway.sh
    depends_on:
      api:
        condition: service_started
    restart: "no"

  web-client:
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      graphql-gateway:
        condition: service_started
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./web-client:/app
      - angular_node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200 --poll 1000"

  opensearch:
    environment:
      - cluster.name=eshop-observability
      - node.name=eshop-opensearch
      - discovery.type=single-node
      - cluster.default_number_of_replicas=0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-V7!qR2@nL9%P4kX6}
    restart: unless-stopped
    mem_limit: 6g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --insecure --user admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-configurator:
    environment:
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-V7!qR2@nL9%P4kX6}
      - OPENSEARCH_INGEST_USERNAME=${OPENSEARCH_INGEST_USERNAME:-eshop_ingest}
      - OPENSEARCH_INGEST_PASSWORD=${OPENSEARCH_INGEST_PASSWORD:-J4@vM8!zQ2%tL7cN5}
      - OPENSEARCH_OPERATOR_USERNAME=${OPENSEARCH_OPERATOR_USERNAME:-eshop_operator}
      - OPENSEARCH_OPERATOR_PASSWORD=${OPENSEARCH_OPERATOR_PASSWORD:-P9!hN3@xC7%rW5qK2}
    entrypoint: ["sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./docker-config/observability/opensearch:/bootstrap:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  opensearch-dashboards:
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      # Use the Security plugin's server account; operators authenticate separately.
      - OPENSEARCH_USERNAME=kibanaserver
      - OPENSEARCH_PASSWORD=kibanaserver
      - SERVER_HOST=0.0.0.0
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-configurator:
        condition: service_completed_successfully

  opensearch-dashboards-configurator:
    environment:
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-V7!qR2@nL9%P4kX6}
    entrypoint: ["sh", "/bootstrap/dashboards-bootstrap.sh"]
    volumes:
      - ./docker-config/observability:/bootstrap:ro
      - ./docker-config/observability/dashboards:/dashboards:ro
    depends_on:
      opensearch-dashboards:
        condition: service_started
    restart: "no"

  otel-collector:
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OTEL_TAIL_SAMPLING_PERCENTAGE=${OTEL_TAIL_SAMPLING_PERCENTAGE:-100}
      - OPENSEARCH_INGEST_USERNAME=${OPENSEARCH_INGEST_USERNAME:-eshop_ingest}
      - OPENSEARCH_INGEST_PASSWORD=${OPENSEARCH_INGEST_PASSWORD:-J4@vM8!zQ2%tL7cN5}
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./docker-config/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - audit_logs:/var/log/eshop/audit:ro
      - otel_collector_state:/var/lib/otelcol
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      opensearch-configurator:
        condition: service_completed_successfully
      otel-collector-configurator:
        condition: service_completed_successfully

  otel-collector-configurator:
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /var/lib/otelcol /var/log/eshop/audit &&
        chown -R 10001:10001 /var/lib/otelcol &&
        chown -R 1654:10001 /var/log/eshop/audit &&
        chmod 0750 /var/log/eshop/audit
    restart: "no"
    volumes:
      - otel_collector_state:/var/lib/otelcol
      - audit_logs:/var/log/eshop/audit
