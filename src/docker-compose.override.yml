x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    environment:
      - POSTGRES_USER=eshopdb
      - POSTGRES_PASSWORD=eshopdb
      - POSTGRES_DB=eshopdb
    ports:
      - "5434:5432"
    restart: always
    volumes:
      - postgres_eshopdb:/var/lib/postgresql
      - ./docker-config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshopdb -d eshopdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *bounded-logging

  # make postgres create schema before using keycloak
  keycloak:
    environment:
      - KEYCLOAK_ADMIN=eshopdb
      - KEYCLOAK_ADMIN_PASSWORD=eshopdb
      - KC_DB=postgres
      #- KC_DB_URL=jdbc:postgresql://postgres:5432/eshopdb?currentSchema=keycloak
      - KC_DB_SCHEMA=keycloak
      - KC_DB_USERNAME=eshopdb
      - KC_DB_PASSWORD=eshopdb
      - KC_HTTP_PORT=9090
      #- KC_HOSTNAME=127.0.0.1
      #- KC_HOSTNAME=http://identity:9090/
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY=edge
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=eshopdb
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker-config/keycloak:/opt/keycloak/data/import:ro
    command:
      - start-dev
      - --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging

  keycloak-configurator:
    environment:
      - KEYCLOAK_URL=http://keycloak:9090
      - KEYCLOAK_ADMIN=eshopdb
      - KEYCLOAK_ADMIN_PASSWORD=eshopdb
      - API_URL=http://api:8080
    volumes:
      - ./docker-config/keycloak/configure-organizations.mjs:/configure-organizations.mjs:ro
      - ./docker-config/keycloak/verify-multitenancy.mjs:/verify-multitenancy.mjs:ro
    command: ["node", "/configure-organizations.mjs"]
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"
    logging: *bounded-logging

  redis:
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    logging: *bounded-logging

  rabbitmq:
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=eshopdb
      - RABBITMQ_DEFAULT_PASS=eshopdb
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    logging: *bounded-logging


  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=postgres;Port=5432;Database=eshopdb;User Id=eshopdb;Password=eshopdb;Include Error Detail=true
      - ConnectionStrings__Redis=redis:6379
      - MessageBroker__Host=amqp://rabbitmq:5672
      - MessageBroker__UserName=eshopdb
      - MessageBroker__Password=eshopdb
      - Keycloak__AuthServerUrl=http://keycloak:9090/
      - Keycloak__PublicIssuer=http://localhost:9090/realms/eshoprealm
      - OTEL_SERVICE_NAME=eshop-api
      - OTEL_DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-Production}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OpenTelemetry__ExportLogs=false
      - AuditTrail__DirectoryPath=/var/log/eshop/audit
      - AuditTrail__FileNamePrefix=eshop-audit
      - AuditTrail__MaxFileSizeBytes=134217728
      - AuditTrail__RetainedFileCount=8
    depends_on:
      alloy:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak-configurator:
        condition: service_completed_successfully
    ports:
      - "5004:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - audit_logs:/var/log/eshop/audit
    labels:
      observability.logs: "true"
      observability.service_name: eshop-api
      observability.environment: ${DEPLOYMENT_ENVIRONMENT:-Production}
    logging: *bounded-logging
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/graphql/catalog/schema.graphqls"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  graphql-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=8080
      - Fusion__SchemaPath=/app/fusion/gateway.far
      - ReverseProxy__Clusters__api__Destinations__primary__Address=http://api:8080/
      - Keycloak__AuthServerUrl=http://keycloak:9090/
      - Keycloak__PublicIssuer=http://localhost:9090/realms/eshoprealm
      - OTEL_SERVICE_NAME=eshop-gateway
      - OTEL_DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-Production}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OpenTelemetry__ExportLogs=false
    volumes:
      - fusion_gateway:/app/fusion:ro
    depends_on:
      graphql-gateway-configurator:
        condition: service_completed_successfully
      alloy:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      observability.logs: "true"
      observability.service_name: eshop-gateway
      observability.environment: ${DEPLOYMENT_ENVIRONMENT:-Production}
    logging: *bounded-logging
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--location", "--output", "/dev/null", "http://localhost:8080/graphql/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  graphql-gateway-configurator:
    working_dir: /workspace
    environment:
      - API_URL=http://api:8080
      - SCHEMA_ROOT=/tmp/fusion
      - ARCHIVE_DIRECTORY=/fusion-output
    volumes:
      - ./:/workspace:ro
      - fusion_gateway:/fusion-output
    command: bash /workspace/docker-config/fusion/compose-gateway.sh
    depends_on:
      api:
        condition: service_started
    restart: "no"
    logging: *bounded-logging

  web-client:
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      graphql-gateway:
        condition: service_started
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./web-client:/app
      - angular_node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200 --poll 1000"
    logging: *bounded-logging

  observability-volume-init:
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /var/lib/alloy /var/lib/grafana /var/lib/loki /var/lib/prometheus /var/lib/tempo /var/log/eshop/audit &&
        chown -R 473:473 /var/lib/alloy &&
        chown -R 472:472 /var/lib/grafana &&
        chown -R 10001:10001 /var/lib/loki /var/lib/tempo &&
        chown -R 65534:65534 /var/lib/prometheus &&
        chmod 0750 /var/log/eshop/audit &&
        chown -R 1654:473 /var/log/eshop/audit
    restart: "no"
    volumes:
      - alloy_data:/var/lib/alloy
      - grafana_data:/var/lib/grafana
      - loki_data:/var/lib/loki
      - prometheus_data:/var/lib/prometheus
      - tempo_data:/var/lib/tempo
      - audit_logs:/var/log/eshop/audit
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging

  loki:
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    volumes:
      - ./docker-config/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/var/lib/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      observability-volume-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging

  tempo:
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    volumes:
      - ./docker-config/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/lib/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      observability-volume-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    user: "65534:65534"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    volumes:
      - ./docker-config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker-config/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "query", "instant", "http://127.0.0.1:9090", "up"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      observability-volume-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging

  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in the environment}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the environment}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:5601}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/eshop-overview.json
    user: "472:472"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    volumes:
      - ./docker-config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker-config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:5601:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      observability-volume-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging

  alloy:
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - OTEL_TAIL_SAMPLING_PERCENTAGE=${OTEL_TAIL_SAMPLING_PERCENTAGE:-100}
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-Development}
    user: "473:473"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./docker-config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
      - audit_logs:/var/log/eshop/audit:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/12345'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      observability-volume-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging
